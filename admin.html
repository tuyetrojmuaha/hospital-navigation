<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tạo mã QR - Quản trị</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .qr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; padding: 16px; }
    .qr-card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 12px; text-align: center; background: white; }
    .qr-card canvas { margin: 0 auto; }
    .qr-card .qr-name { font-weight: 700; margin-top: 8px; }
    .qr-card .qr-id { color: #6b7280; font-size: 12px; }
    @media print {
      .no-print { display: none; }
      .qr-card { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <header class="app-header">🖨️ In mã QR dán tường (Quản trị)</header>
  <p class="no-print" style="text-align:center; padding: 8px 16px;">
    Mỗi thẻ dưới đây tương ứng với một vị trí trong <code>map-data.js</code>. Mã QR chứa
    <strong>đường link đầy đủ</strong> tới <code>index.html</code> kèm vị trí — quét bằng camera điện thoại rồi
    bấm vào link sẽ mở app đúng ngay vị trí đó, không cần quét lại trong app.
  </p>
  <div class="no-print" style="max-width:480px;margin:0 auto 16px;padding:0 16px;">
    <label for="base-url-input" style="font-size:13px;color:#6b7280;">
      Địa chỉ trang <code>index.html</code> sau khi deploy (tự động điền, có thể sửa nếu sai):
    </label>
    <input id="base-url-input" type="text" class="search-input" style="margin-top:4px;" />
  </div>
  <button class="no-print btn-secondary" style="display:block;margin:0 auto 16px;" onclick="window.print()">In tất cả mã QR</button>

  <div id="qr-grid" class="qr-grid"></div>

  <script src="https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="map-image.js?v=3"></script>
  <script src="map-data.js?v=3"></script>
  <script>
    // Địa chỉ trang thật sau khi deploy lên GitHub Pages. Sửa lại đây nếu domain đổi.
    const guessedBaseUrl = "https://tuyetrojmuaha.github.io/hospital-navigation/index.html";
    document.getElementById("base-url-input").value = guessedBaseUrl;

    const grid = document.getElementById("qr-grid");

    function renderAllQrCodes() {
      const baseUrl = document.getElementById("base-url-input").value.trim() || guessedBaseUrl;
      grid.innerHTML = "";
      HOSPITAL_MAP.nodes.forEach((node) => {
        const card = document.createElement("div");
        card.className = "qr-card";
        const canvasHolder = document.createElement("div");
        card.appendChild(canvasHolder);

        const nameEl = document.createElement("div");
        nameEl.className = "qr-name";
        nameEl.textContent = node.name;
        card.appendChild(nameEl);

        const link = `${baseUrl}?node=${encodeURIComponent(node.id)}`;
        const idEl = document.createElement("div");
        idEl.className = "qr-id";
        idEl.textContent = node.isGate ? `${node.id} · Cổng` : `${node.id} · Khu nhà`;
        card.appendChild(idEl);

        grid.appendChild(card);

        // Nội dung mã QR giờ là 1 đường LINK đầy đủ, không còn là mã trần nữa.
        new QRCode(canvasHolder, {
          text: link,
          width: 160,
          height: 160,
        });
      });
    }

    document.getElementById("base-url-input").addEventListener("change", renderAllQrCodes);
    renderAllQrCodes();
  </script>
</body>
</html>
